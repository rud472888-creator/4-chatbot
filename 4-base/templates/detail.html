<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot.name }} - 통신 연결</title>
    <style>
        @font-face {
            font-family: 'DXTaja';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DXTaja.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            /* 우주선 배경 이미지 */
            background-image: url("{{ url_for('static', filename='images/hateslop/corridor_bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-color: #050814;
            font-family: 'Pretendard', 'IBM Plex Sans KR', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-header {
            padding-top: 30px;
            padding-bottom: 20px;
            padding-left: 80px;
        }
        .logo { width: 280px; }

        /* 메인 레이아웃 (좌측 메뉴 + 중앙 화면) */
        .game-layout {
            display: flex;
            flex: 1;
            padding: 0 40px;
            position: relative;
        }

        /* 좌측 사이드바 (전력량, 메뉴, 추천 질문) */
        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        /* 유리 질감 공통 클래스 (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
        }

        

        /* 미니 피코 아이콘 5개 묶음 (배경 이미지 위로 띄움) */
        .battery-icons {
            position: absolute; /* 중요! 이미지 위로 강제로 띄움 */
            bottom: 22%; /* 배경 박스의 맨 아래에서 22% 높이에 배치 */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px; /* 피코 아이콘 사이 간격 */
        }

        /* 5칸짜리 미니 피코 아이콘 기본 상태 */
        .battery-img {
            width: 24px; /* 박스 크기에 맞춰 아이콘 크기 살짝 조절 */
            height: auto;
            transition: all 0.3s ease;
        }

        /* 전력이 소모되었을 때의 클래스 */
        .battery-img.empty {
            opacity: 0.2;
            filter: grayscale(100%);
        }

        .sidebar {
            padding: 20px;
            width: 360px;
        }

        .sidebar-panel-img {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 600px;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            z-index: 0;
        }

        .sidebar-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }

        .ui-img-box {
            position: relative;
            width: 100%;
        }

        .ui-img-box > img {
            width: 100%;
            height: auto;
            display: block;
        }

        .power-wrapper .battery-icons {
            position: absolute;
            bottom: 20%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .menu-btn {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .menu-btn:hover {
            transform: scale(1.03);
        }

        .recommend-text-list ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        .recommend-text-list li {
            cursor: pointer;
        }
        .recommend-text-list li:hover {
            color: #f7e9a0;
        }

        .recommend-wrapper .recommend-text-list {
            position: absolute;
            top: 65px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .recommend-text-list p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.1rem;
            margin-bottom: 12px;
            line-height: 1.4;
            word-break: keep-all;
            cursor: pointer;
            transition: color 0.2s;
        }

        .recommend-text-list p:hover {
            color: #f7e9a0;
        }

        .chat-history-text {
            margin-top: 30px;
            font-family: 'Pretendard', sans-serif;
            font-size: 1.15rem;
            text-align: center;
            color: #a8d5e5;
            max-width: 750px;
            word-break: keep-all;
            line-height: 1.6;
        }

        /* 중앙 화면 (캐릭터 & 홀로그램) */
        .center-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 피코 이미지 */
        .character-pico {
            width: 350px;
            animation: float 3s ease-in-out infinite;
        }

        /* 레이아웃 전환 속성 */
        .normal-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .briefing-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            gap: 30px;
            width: 100%;
            transform: translateY(-170px) translateX(0px);
        }

        /* 피코 크기 상태 */
        .pico-normal {
            width: 250px; /* 원래 피코 크기에 맞게 조절 */
            transition: all 0.5s ease;
        }

        .pico-small {
            width: 160px; /* 브리핑 시 작아지는 크기 */
            transition: all 0.5s ease;
        }

        /* 브리핑 박스 디자인 */
        /* 브리핑 텍스트 박스 + 화살표를 세로로 정렬하는 래퍼 */
        .briefing-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* 화살표를 박스의 오른쪽 아래로 정렬 (가운데를 원하면 center로 변경) */
            gap: 15px; /* 텍스트 박스와 화살표 사이의 간격 */
            width: 650px;
        }

        /* 브리핑 박스 디자인 (첨부 이미지 배경 적용) */
        .briefing-box {
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            width: 680px;
            height: 480px; 
            padding: 55px 60px;
            box-sizing: border-box; 
            overflow: hidden;
        }

        .briefing-arrow-area {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            height: 40px; 
            margin-top: 5px;
            position: relative; /* 추가: z-index가 먹히도록 위치 기준점 설정 */
            z-index: 999;       /* 추가: 무조건 맨 앞으로 오게 설정 */
        }

        #briefing-next-btn {
            cursor: pointer;
            transition: filter 0.2s; /* 부드러운 효과 */
        }

        .briefing-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.0rem;
            color: #cfd8dc;
            white-space: pre-wrap;
            line-height: 2.2;
            height: 100%;
            overflow-y: auto;
        }

        .briefing-text::-webkit-scrollbar {
            width: 0px; 
        }

        .align-right {
            align-self: flex-end; /* 화살표를 우측 하단으로 */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* 하단 채팅 입력창 */
        .chat-container {
            position: fixed !important;
            bottom: 60px; /* 🔼 상하 위치 조절 */
            left: 450px;  /* ◀️▶️ 좌우 위치 조절 */
            width: 950px !important; /* ↔️ 가로 길이 조절 */
            z-index: 100;
        }

        .chat-container .send-btn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 101;
        }

        .chat-text-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            min-height: 80px; /* 텍스트 박스 높이 고정 */
        }

        .chat-history-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.15rem;
            color: #a8d5e5;
            word-break: keep-all;
            line-height: 1.6;
            text-align: center;
            white-space: pre-wrap;
            width: 600px; /* 텍스트 영역 너비 고정으로 화살표 밀림 방지 */
        }

        .next-arrow {
            width: 35px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
            padding-bottom: 5px;
        }

        .next-arrow:hover {
            transform: translateX(8px);
        }

        .custom-input-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .input-bg-img {
            width: 100%;
            height: auto;
            border-radius: 8px !important;
            display: block;
        }

        .input-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        #user-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-family: 'Pretendard', sans-serif;
            outline: none;
            padding-left: 40px;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-img-btn {
            width: 40px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .send-img-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .mission-file-image {
            width: 650px;
            height: 480px;
            object-fit: contain;
            border-radius: 8px;
        }

        .chat-record-image {
            width: 680px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        /* 페이즈 전환 애니메이션 클래스 */
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        .fade-in {
            display: block !important; /* display: none을 덮어씌움 */
            animation: fadeIn 1s forwards;
        }

        .auth-panel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            transform: translateY(65px);
        }

        .auth-image {
            width: 750px;
            height: auto;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.9) translateY(20px); visibility: hidden; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.1) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* =========================================
          📱 모바일 전용 UI (화면 가로 768px 이하)
          ========================================= */
        @media screen and (max-width: 768px) {
            /* 1. 상단 로고 숨기기 (시안에 맞춰 공간 확보) */
            .top-header {
                display: none;
            }

            /* 2. 전체 레이아웃 겹치게(Absolute) 변경 */
            .game-layout {
                padding: 0;
                position: static; 
            }

            /* 3. 사이드바 UI를 우측 상단으로 띄우기 */
            .sidebar {
                position: absolute;
                top: 30px;
                right: 20px;
                width: auto; /* 고정 너비 풀고 내용물에 맞춤 */
                align-items: flex-end; /* 요소들을 오른쪽으로 정렬 */
                z-index: 20;
                gap: 10px;
            }

            /* 4. 유리 패널과 버튼 크기 모바일에 맞게 축소 */
            .glass-panel {
                padding: 10px 15px;
                border-radius: 15px;
            }
            /* 전력량 라벨 이미지 크기 */
            .power-label-img {
                width: 100%;
                max-width: 140px; /* 라벨 크기가 너무 커지지 않게 제한 */
                margin-bottom: 10px;
                display: inline-block;
            }

            /* 5칸짜리 미니 피코 아이콘 기본 상태 */
            .battery-img {
                width: 28px; /* 피코 아이콘 크기 (원하는 대로 조절해!) */
                height: auto;
                transition: all 0.3s ease; /* 꺼질 때 부드럽게 변하도록 */
            }

            /* 전력이 소모되었을 때의 클래스 (흑백 처리 & 투명도 낮춤) */
            .battery-img.empty {
                opacity: 0.2; /* 투명하게 */
                filter: grayscale(100%); /* 흑백으로 만들어서 불 꺼진 느낌 팍팍! */
            }
            /* 모바일 미디어 쿼리 안쪽의 기존 .menu-btn 코드를 지우고 아래 코드로 교체! */
            .menu-image-btn {
                width: 110px; /* 모바일에 맞게 이미지 크기 축소 */
                margin: 0;    /* 모바일에서는 우측 상단으로 띄울 거니까 마진 제거 */
            }

            /* 5. 추천 질문 리스트는 모바일 화면을 너무 가리므로 일단 숨김 */
            .recommend-wrapper {
                position: relative;
                width: 100%;
                max-width: 320px;
                margin-top: 20px;
            }

            .recommend-bg-img {
                width: 100%;
                height: auto;
                display: block;
                border-radius: 20px;
            }

            .recommend-content {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                padding: 25px 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
            }

            .recommend-title {
                color: #fff;
                font-weight: bold;
                font-size: 1.1rem;
                margin-bottom: 15px;
            }

            .recommend-list p {
                color: rgba(255, 255, 255, 0.85);
                font-size: 0.95rem;
                margin-bottom: 12px;
                line-height: 1.4;
                word-break: keep-all;
                cursor: pointer;
            }

            .recommend-list p:hover {
                color: #f7e9a0;
            }

            /* 6. 피코 이미지 중앙 하단으로 배치 */
            .center-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                justify-content: flex-end; /* 아래쪽으로 밀어내기 */
                padding-bottom: 150px; /* 채팅창에 가려지지 않게 여백 주기 */
                z-index: 10;
            }
            .character-pico {
                width: 250px; /* 모바일 비율에 맞춰 크기 축소 */
            }

            /* 7. 채팅창을 화면 맨 아래에 꽉 차게 고정 */
            .chat-container {
                position: fixed !important;
                bottom: 60px; /* 🔼 상하 위치 조절 */
                left: 450px;  /* ◀️▶️ 좌우 위치 조절 */
                width: 950px !important; /* ↔️ 가로 길이 조절 */
                z-index: 100;
            }

            .chat-container .send-btn {
                position: absolute;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 101;
            }
            .custom-input-wrapper {
                width: 100%;
            }
            
            #user-input {
                font-size: 1rem; /* 좁은 화면에 맞춰 글씨 크기 살짝 줄임 */
                padding-left: 30px; /* 왼쪽에 있는 별모양 여백도 모바일에 맞춰 살짝 줄임 */
            }

            .send-img-btn {
                width: 32px; /* 전송 버튼 이미지도 모바일 비율에 맞게 살짝 축소 */
            }
        }
    </style>
</head>
<body>
    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 99999; pointer-events: none; transition: opacity 1s ease;"></div>

    <div id="start-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99998; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <img src="{{ url_for('static', filename='images/hateslop/start_bg.png') }}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1;" alt="배경">
        <img src="{{ url_for('static', filename='images/hateslop/start_start_button.png') }}" id="game-start-btn" style="position:relative; z-index:2; margin-top:15%; cursor:pointer; width:150px; transition:transform 0.2s ease, filter 0.2s ease;" alt="START">
    </div>

    <!-- [피코 대화 시작] -->
    <div id="main-game-ui" style="display: none;">
        <header class="top-header">
            <img src="{{ url_for('static', filename='images/hateslop/logo.png') }}" alt="Project Ariadne" class="logo">
        </header>

        <div class="game-layout">
            <div class="sidebar">
                <div class="sidebar-panel-img">
                    <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_left_box.png') }}" class="bg-layer" alt="사이드바 대화 시작 배경">

                    <div class="sidebar-content">
                        <div class="ui-img-box power-wrapper">
                            <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_left_engine.png') }}" alt="전력량">
                            <div class="battery-icons">
                                <img src="{{ url_for('static', filename='images/hateslop/electricity_icon.png') }}" class="battery-img" id="bat-5" alt="전력">
                                <img src="{{ url_for('static', filename='images/hateslop/electricity_icon.png') }}" class="battery-img" id="bat-4" alt="전력">
                                <img src="{{ url_for('static', filename='images/hateslop/electricity_icon.png') }}" class="battery-img" id="bat-3" alt="전력">
                                <img src="{{ url_for('static', filename='images/hateslop/electricity_icon.png') }}" class="battery-img" id="bat-2" alt="전력">
                                <img src="{{ url_for('static', filename='images/hateslop/electricity_icon.png') }}" class="battery-img" id="bat-1" alt="전력">
                            </div>
                        </div>

                        <div class="ui-img-box menu-btn" id="btn-clue">
                            <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_clue_note.png') }}" alt="단서 노트">
                        </div>

                        <div class="ui-img-box recommend-wrapper" id="recommend-list">
                            <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_recommended_qs.png') }}" alt="추천 질문">
                            <div class="recommend-text-list" style="display: none;">
                                <ul>
                                    <li>- 나는 너에게 뭘 자주 물었어?</li>
                                    <li>- 나와의 대화 기록을 보여줘.</li>
                                    <li>- 너는 나를 어떤 사용자로 기억해?</li>
                                    <li>- 내가 특히 잘한 건 뭐야?</li>
                                    <li>- 나는 주로 어떤 공간에 있었어?</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="center-display-wrapper" class="normal-layout">
                <img src="{{ url_for('static', filename='images/hateslop/pico.png') }}" alt="피코" class="character-pico pico-normal" id="pico-avatar">
                
                <div id="standard-chat-area" class="chat-text-container">
                    <div id="chat-history" class="chat-history-text"></div>
                    <img src="{{ url_for('static', filename='images/hateslop/chat_skip_button.png') }}" id="next-arrow-btn" class="next-arrow" alt="다음 대사">
                </div>

                <div id="briefing-area" class="briefing-wrapper" style="display: none;">
                    <div class="briefing-box" style="background-image: url('{{ url_for('static', filename='images/hateslop/briefing_frame_box.png') }}');">
                        <div id="briefing-history" class="briefing-text"></div>
                    </div>
                    <div class="briefing-arrow-area">
                        <img src="{{ url_for('static', filename='images/hateslop/chat_skip_button.png') }}" id="briefing-next-btn" class="next-arrow" alt="다음 대사" style="visibility: hidden;">
                    </div>

                sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                inputBgImage: "images/hateslop/cockpit_input.png",
                powerBgImage: "images/hateslop/cockpit_left_electric.png",
                recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                bgImage: "images/hateslop/cockpit_bg.jpg",
                recommendQuestions: [
                    "내가 살던 집 사진을 보여줘",
                    "내 인간관계는 어땠지?",
                    "내 평소 습관을 알려줘",
                    "내 취미는 어땠지?",
                    "최근 SNS 포스트를 보여줘"
                ]
            };

            scenes.push(newScene);
            currentSceneIndex = scenes.length - 1;
            renderScene(currentSceneIndex);

            if (currentPhase === "name" && questionCount === 3 && isQuestion) {
                const hintScene1 = {
                    id: nextId + 1,
                    text: "전 적막이 참 싫단 말이죠. 평소에 당신이 자주 듣던 음악을 틀어드릴게요.",
                    showArrow: true,
                    showPico: true,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: false,
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: newScene.recommendQuestions
                };

                const hintScene2 = {
                    id: nextId + 2,
                    text: "어때요? 조금 도움이 되죠! 이 흐름을 타서 빨리 다음 질문을 던져보세요!",
                    showArrow: false,
                    showPico: false,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: true,
                    roleAuthImage: "images/hateslop/album_hint.png",
                    playAudio: "audios/hateslop/kpop_hint.mp3",
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: newScene.recommendQuestions
                };

                scenes.push(hintScene1, hintScene2);
            }

            if (currentPhase === "name" && questionCount === 5 && isQuestion) {
                let lastId = scenes[scenes.length - 1].id;

                const exhaustScene1 = {
                    id: lastId + 1,
                    text: "이름을 맞추기 위해 할당된 전력이 모두 소모되었어요.\n더 이상 질문을 받을 수 없게 되었습니다.",
                    showArrow: true,
                    showPico: true,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: false,
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: newScene.recommendQuestions
                };

                const exhaustScene2 = {
                    id: lastId + 2,
                    text: "당신의 안전한 귀환을 위해서니까 이해해주실거라 믿어요.",
                    showArrow: true,
                    showPico: true,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: false,
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: newScene.recommendQuestions
                };

                const exhaustScene3 = {
                    id: lastId + 3,
                    text: "자 이제 시동을 걸어볼 시간이에요.\n당신의 이름을 말할 준비는 되었겠죠?",
                    showArrow: true,
                    showPico: true,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: false,
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: newScene.recommendQuestions
                };

                const exhaustScene4 = {
                    id: lastId + 4,
                    text: "",
                    showArrow: false,
                    showPico: false,
                    showHologram: false,
                    isBriefing: false,
                    showRecommendText: true,
                    showMissionFile: false,
                    showChatRecord: false,
                    showRoleAuth: true,
                    roleAuthImage: "images/hateslop/name_input_display.png",
                    isNameInputScene: true,
                    sidebarMainBgImage: "images/hateslop/cockpit_box_bg.png",
                    inputBgImage: "images/hateslop/cockpit_input.png",
                    powerBgImage: "images/hateslop/cockpit_left_electric.png",
                    recommendBgImage: "images/hateslop/cockpit_recommended_qs.png",
                    bgImage: "images/hateslop/cockpit_bg.jpg",
                    recommendQuestions: []
                };

                scenes.push(exhaustScene1, exhaustScene2, exhaustScene3, exhaustScene4);
            }
        }

        async function onSendClick() {
            const message = userInputField.value.trim();
            if (!message) return;
            userInputField.value = '';
            clearAutoAdvance();
            const currentScene = scenes[currentSceneIndex];
            if (currentScene && currentScene.advanceOnInput) {
                nextSceneLogic();
                return;
            }
            if (!isNameInputMode && !isJobInputMode) {
                if (currentBattery <= 0) return;
                decreaseBattery();
            }
            await handleUserInput(message);
        }
        
        function renderScene(index) {
            const scene = scenes[index];
            isJobInputMode = scene.isJobInputScene === true;
            isNameInputMode = scene.isNameInputScene === true;

            const picoImageElement = document.getElementById("pico-avatar");

            if (scene.picoPosition === "bottom-left") {
                picoImageElement.style.transform = "scale(0.7)"; // 크기 약간 줄이기
                picoImageElement.style.position = "absolute";
                picoImageElement.style.bottom = "10%";
                picoImageElement.style.left = "15%"; 
            } else {
                // 원래 중앙 자리로 되돌리기 (기본값)
                picoImageElement.style.transform = "none";
                picoImageElement.style.position = "static"; // 또는 원래 설정된 값
            }
            
            // [안전장치] 해당 인덱스에 장면 데이터가 없으면 실행 중단 (콘솔 에러 방지)
            if (!scene) {
                console.error(`장면을 찾을 수 없습니다: 인덱스 ${index}`);
                return;
            }

            clearInterval(typingInterval);
            [nextArrowBtn, briefingNextBtn, missionNextBtn, recordNextBtn, roleAuthNextBtn].forEach(btn => {
                if (btn) btn.style.visibility = 'hidden';
            });

            // 배경 및 입력창 배경 업데이트
            if (scene.bgImage) {
                document.body.style.backgroundImage = `url('/static/${scene.bgImage}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            } else {
                document.body.style.backgroundImage = '';
            }
            dynamicInputBg.src = `/static/${scene.inputBgImage}`;

            if (sidebarMainBg && scene.sidebarMainBgImage) {
                sidebarMainBg.src = `/static/${scene.sidebarMainBgImage}`;
            }

            if (chatInputBg && scene.inputBgImage) {
                chatInputBg.src = `/static/${scene.inputBgImage}`;
            }
            
            if (powerBgImg && scene.powerBgImage) {
                powerBgImg.src = `/static/${scene.powerBgImage}`;
            }
            
            if (recommendBgImg && scene.recommendBgImage) {
                recommendBgImg.src = `/static/${scene.recommendBgImage}`;
            }
            
            // 모든 주요 영역의 표시 여부를 장면 설정에 맞춰 일괄 업데이트
            picoAvatar.style.display = scene.showPico ? 'block' : 'none';
            if (authPanel) authPanel.style.display = scene.showHologram ? 'flex' : 'none';
            if (missionFileArea) missionFileArea.style.display = scene.showMissionFile ? 'flex' : 'none';
            if (chatRecordArea) chatRecordArea.style.display = scene.showChatRecord ? 'flex' : 'none';
            if (roleAuthArea) roleAuthArea.style.display = scene.showRoleAuth ? 'flex' : 'none';
            
            if (recommendTextList) {
                recommendTextList.style.display = scene.showRecommendText ? 'block' : 'none';
                
                if (scene.showRecommendText && scene.recommendQuestions) {
                    const listUl = recommendTextList.querySelector('ul');
                    if (listUl) {
                        // 1. 기존 리스트 비우기
                        listUl.innerHTML = "";
                        // 2. 새로운 질문들 추가하기
                        scene.recommendQuestions.forEach(q => {
                            const li = document.createElement('li');
                            li.textContent = `- ${q}`;
                            
                            // 3. (중요) 새로 만든 리스트 아이템에도 클릭 이벤트 다시 걸기
                            li.addEventListener('click', () => {
                                if (userInputField) {
                                    userInputField.value = q;
                                }
                            });
                            
                            listUl.appendChild(li);
                        });
                    }
                }
            }

            let targetTextObj;
            let targetArrowBtn;

            // --- 레이아웃 분기 처리 ---

            // 1. 대화 기록 화면 (14번, 20번 장면 등)
            if (scene.showChatRecord) {
                if (chatRecordImg && scene.chatRecordImage) {
                    chatRecordImg.src = `/static/${scene.chatRecordImage}`;
                }
                centerDisplayWrapper.className = 'briefing-layout';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'none';
                if (missionFileArea) missionFileArea.style.display = 'none';
                if (roleAuthArea) roleAuthArea.style.display = 'none'; // 역할 인증창 숨김
                
                recordNextBtn.style.visibility = scene.showArrow ? 'visible' : 'hidden';
                return; 
            } 
            
            // 2. 역할 인증 화면 (15, 16, 17번 장면 등)
            else if (scene.showRoleAuth) {
                if (roleAuthImg && scene.roleAuthImage) {
                    roleAuthImg.src = `/static/${scene.roleAuthImage}`;
                }
                centerDisplayWrapper.className = 'normal-layout';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'none';
                if (missionFileArea) missionFileArea.style.display = 'none';
                if (chatRecordArea) chatRecordArea.style.display = 'none'; // 대화 기록창 숨김
                
                if (scene.showPico) {
                    picoAvatar.className = 'character-pico pico-small';
                    picoAvatar.style.position = 'absolute';
                    picoAvatar.style.left = '25%'; // 왼쪽 여백 (화면에 맞게 숫자 조절 가능)
                    picoAvatar.style.top = '60%';  // 위쪽 여백 (숫자가 클수록 아래로 내려감)
                    picoAvatar.style.transform = 'translateY(-50%)';
                } else {
                    // 피코를 숨겨야 할 때는 위치 설정 초기화
                    picoAvatar.style.position = '';
                    picoAvatar.style.left = '';
                    picoAvatar.style.top = '';
                    picoAvatar.style.transform = '';
                }

                if (scene.showArrow && roleAuthNextBtn) {
                    roleAuthNextBtn.style.visibility = 'visible';
                } else if (roleAuthNextBtn) {
                    roleAuthNextBtn.style.visibility = 'hidden';
                }
                return;
            } 

            // 3. 미션 파일 화면
            else if (scene.showMissionFile) {
                centerDisplayWrapper.className = 'briefing-layout';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'none';
                missionNextBtn.style.visibility = scene.showArrow ? 'visible' : 'hidden';
                return; 
            } 

            // 4. 브리핑 화면
            else if (scene.isBriefing) {
                centerDisplayWrapper.className = 'briefing-layout';
                picoAvatar.className = 'character-pico pico-small';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'flex';
                targetTextObj = briefingHistoryObj;
                targetArrowBtn = briefingNextBtn;
            } 
            
            // 5. 일반 대화 화면 (피코 중앙)
            else {
                centerDisplayWrapper.className = 'normal-layout';
                picoAvatar.className = 'character-pico pico-normal';
                standardChatArea.style.display = 'flex';
                briefingArea.style.display = 'none';
                targetTextObj = chatHistoryObj;
                targetArrowBtn = nextArrowBtn;
            }

            if (scene.playAudio) {
                const audio = new Audio(`/static/${scene.playAudio}`);
                audio.play();
            }

            // 텍스트 타이핑 로직
            targetTextObj.textContent = ""; 
            targetArrowBtn.style.visibility = 'hidden';

            let charIndex = 0;
            typingInterval = setInterval(() => {
                if (charIndex < scene.text.length) {
                    targetTextObj.textContent += scene.text[charIndex];
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    if (scene.showArrow) {
                        targetArrowBtn.style.visibility = 'visible';
                    }
                    if (scene.autoAdvanceSec) {
                        autoAdvanceTimer = setTimeout(nextSceneLogic, scene.autoAdvanceSec * 1000);
                    }
                }
            }, 40);
        }

        function playIntroSequence() {
            // 게임 UI는 숨기고 영상 레이어만 보이게 설정
            mainGameUI.style.display = 'none';
            videoOverlay.style.display = 'block';

            // 첫 번째 영상 로드 및 재생
            endingVideo.src = introVideos[currentIntroIndex];
            endingVideo.play();

            // 영상이 끝날 때마다 실행되는 이벤트 리스너
            endingVideo.onended = () => {
                currentIntroIndex++;

                if (currentIntroIndex < introVideos.length) {
                    // 다음 인트로 영상이 있으면 재생
                    endingVideo.src = introVideos[currentIntroIndex];
                    endingVideo.play();
                } else {
                    // 모든 영상이 끝나면 영상 레이어 숨기고 게임 시작
                    videoOverlay.style.display = 'none';
                    mainGameUI.style.display = 'block';
                    renderScene(0); // 0번 장면(프롤로그) 호출
                }
            };
        }

        if (recordNextBtn) recordNextBtn.addEventListener('click', nextSceneLogic);
        if (nextArrowBtn) nextArrowBtn.addEventListener('click', nextSceneLogic);
        if (briefingNextBtn) briefingNextBtn.addEventListener('click', nextSceneLogic);
        if (missionNextBtn) missionNextBtn.addEventListener('click', nextSceneLogic);
        if (roleAuthNextBtn) roleAuthNextBtn.addEventListener('click', nextSceneLogic);

        if (sendBtn) sendBtn.addEventListener('click', onSendClick);
        if (userInputField) userInputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') onSendClick();
        });

        if (recommendTextList) {
            recommendTextList.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li && userInputField) {
                    userInputField.value = li.textContent.replace(/^-\s*/, '').trim();
                    userInputField.focus();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fade-overlay').style.opacity = '0';
            const startBtn = document.getElementById('game-start-btn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    const startScreen = document.getElementById('start-screen');
                    startScreen.style.transition = 'opacity 0.6s';
                    startScreen.style.opacity = '0';
                    setTimeout(() => {
                        startScreen.style.display = 'none';
                        mainGameUI.style.display = 'block';
                        renderScene(0);
                    }, 600);
                });
            }
        });
    </script>
</body>
</html>
