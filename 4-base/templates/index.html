<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Ariadne - Who am I?</title>
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'DXTaja';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DXTaja.woff') format('woff');
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'DXTaja', 'Courier New', monospace;
        background-color: #050814;
        color: #d4d4d4;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        max-width: 800px;
        width: 90%;
        text-align: center;
        padding: 40px;
        border: 1px solid #1a2235;
        background: rgba(10, 15, 30, 0.8);
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }
      .title {
        font-size: 2.5rem;
        color: #ff3333;
        margin-bottom: 20px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
      }
      .intro-text {
        font-size: 1.2rem;
        line-height: 2;
        margin-bottom: 40px;
        text-align: left;
        word-break: keep-all;
      }
      .start-btn {
        display: inline-block;
        padding: 15px 50px;
        color: #050814;
        background: #ff3333;
        text-decoration: none;
        border-radius: 5px;
        font-size: 1.3rem;
        font-weight: bold;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .start-btn:hover {
        background: #ff6666;
        box-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">PROJECT ARIADNE</h1>
      <div class="intro-text">
        당신은 우주 한가운데에 있습니다.<br>
        그러나 기억이 아무것도 나지 않습니다. 이름도, 이곳에 온 이유도, 함께 있던 사람들의 얼굴도 떠오르지 않습니다.<br><br>
        다만 한 가지는 분명합니다.<br>
        집으로 돌아가야 합니다. 그 집조차 기억이 나지 않지만요.
      </div>
      <a href="{{ url_for('detail') }}" class="start-btn">시스템 접속</a>
    </div>
  </body>
</html>
