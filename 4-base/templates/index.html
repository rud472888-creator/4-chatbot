<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Ariadne - Who am I?</title>
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'DXTaja';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DXTaja.woff') format('woff');
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'DXTaja', 'Courier New', monospace;
        background-color: #050814;
        color: #d4d4d4;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container {
        max-width: 800px;
        width: 90%;
        text-align: center;
        padding: 40px;
        border: 1px solid #1a2235;
        background: rgba(10, 15, 30, 0.8);
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }
      .title {
        font-size: 2.5rem;
        color: #ff3333;
        margin-bottom: 20px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
      }
      .intro-text {
        font-size: 1.2rem;
        line-height: 2;
        margin-bottom: 40px;
        text-align: left;
        word-break: keep-all;
      }
      .start-btn {
          position: relative;
          z-index: 2;
          width: 150px;
          margin-top: 80vh;
          cursor: pointer;
          transition: transform 0.2s ease, filter 0.2s ease;
          background: transparent;
          border: none;
          padding: 0;
          outline: none;
      }

      .start-btn:hover {
          transform: scale(1.05);
          filter: brightness(1.2);
      }

      body {
          margin: 0;
          background-color: #000;
          overflow: hidden; /* 스크롤바 방지 */
      }

      .start-screen-container {
          position: relative;
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
      }

      .start-bg {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: 1;
      }

      .start-btn {
          position: relative;
          z-index: 2;
          margin-top: 15%;
          cursor: pointer;
          transition: transform 0.2s ease, filter 0.2s ease;
      }

      .start-btn:hover {
          transform: scale(1.05);
          filter: brightness(1.2);
      }
    </style>
  </head>
  <body>
    <div class="start-screen-container">
        <img src="{{ url_for('static', filename='images/hateslop/start_bg.png') }}" class="start-bg" alt="배경">
        <img src="{{ url_for('static', filename='images/hateslop/start_start_button.png') }}" id="start-btn" class="start-btn" alt="START">
    </div>
    <script>
        const startBtn = document.getElementById('start-btn');

    startBtn.addEventListener('click', () => {
        // 1. body 전체를 부드럽게 까만색으로 페이드 아웃
        document.body.style.transition = 'background-color 1s ease, opacity 1s ease';
        document.body.style.backgroundColor = '#000'; // 배경을 먼저 까맣게
        
        // start-screen-container 전체를 투명하게
        document.querySelector('.start-screen-container').style.transition = 'opacity 1s ease';
        document.querySelector('.start-screen-container').style.opacity = '0';
        
        // 2. 1초 뒤에(효과가 끝난 후) 페이지 이동
        setTimeout(() => {
            window.location.href = '/detail'; 
        }, 1000); 
    });
    </script>
  </body>
</html>
